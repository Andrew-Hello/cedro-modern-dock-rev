name: Build Cedro Enhanced

on:
  push:
    branches:
      - cedro-enhanced-window
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        working-directory: dotnet
        run: dotnet restore

      - name: Build Release
        working-directory: dotnet
        run: dotnet build src/CedroModernDock -c Release --no-restore

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: CedroModernDock-Enhanced-win-x64
          path: dotnet/src/CedroModernDock/bin/Release/net9.0-windows/
          if-no-files-found: error

# Enhanced window behavior build checkpoint.

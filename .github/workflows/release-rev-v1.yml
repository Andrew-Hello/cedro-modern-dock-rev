name: Release Cedro Rev v1.0.0

on:
  push:
    branches:
      - stable/rev-v1.0.0

permissions:
  contents: write

env:
  RELEASE_TAG: rev-v1.0.0
  RELEASE_TITLE: Cedro Modern Dock Rev v1.0.0
  RELEASE_ZIP: CedroModernDock-Rev-v1.0.0-win-x64.zip

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout stable baseline
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        working-directory: dotnet
        run: dotnet restore

      - name: Build stable Release
        working-directory: dotnet
        run: dotnet build src/CedroModernDock -c Release --no-restore

      - name: Package tested build layout
        shell: pwsh
        run: |
          $source = 'dotnet/src/CedroModernDock/bin/Release/net9.0-windows'
          if (-not (Test-Path "$source/CedroModernDock.exe")) {
            throw 'CedroModernDock.exe was not produced.'
          }
          if (Test-Path $env:RELEASE_ZIP) {
            Remove-Item $env:RELEASE_ZIP -Force
          }
          Compress-Archive -Path "$source/*" -DestinationPath $env:RELEASE_ZIP -CompressionLevel Optimal

      - name: Create GitHub Release and tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:RELEASE_TAG $env:RELEASE_ZIP `
            --target $env:GITHUB_SHA `
            --title $env:RELEASE_TITLE `
            --notes-file RELEASE_NOTES_rev-v1.0.0.md

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: CedroModernDock-Rev-v1.0.0-win-x64
          path: CedroModernDock-Rev-v1.0.0-win-x64.zip
          if-no-files-found: error

settings.general.windowBehavior.title=Window behavior
settings.general.alwaysOnTop.title=Always on top
settings.general.alwaysOnTop.helper=Keep the Dock above normal windows. While another app or game is truly fullscreen, topmost is temporarily suspended and automatically restored when fullscreen ends.
settings.general.edgeAutoHide.title=Auto-hide at screen edge
settings.general.edgeAutoHide.helper=Static positioning uses its selected edge. In Dynamic positioning, drag the Dock near any enabled edge and release to attach. A visible tail remains while hidden; hover or click it to reveal the Dock.
settings.general.edgeAutoHide.horizontal.title=Horizontal edges (Top / Bottom)
settings.general.edgeAutoHide.horizontal.helper=Allow the Dock to attach to the top or bottom edge and auto-hide. Bottom docking automatically stays above the Windows taskbar.
settings.general.edgeAutoHide.vertical.title=Vertical edges (Left / Right)
settings.general.edgeAutoHide.vertical.helper=Allow the Dock to attach to the left or right edge and auto-hide independently of horizontal edges.
settings.general.interaction.title=Dock interaction & cues
settings.general.runningIndicators.title=Show running indicators
settings.general.runningIndicators.helper=Show the small white status dot under an icon while its program is running. Turning it off only hides the dot.
settings.general.hoverMagnification.title=Magnify icons on hover
settings.general.hoverMagnification.helper=Slightly enlarge an icon while the pointer is over it. Disable this to keep icons at their normal size.
settings.general.hoverLabels.title=Show app names on hover
settings.general.hoverLabels.helper=Show an item name tooltip while hovering. Disable this to suppress the label popup.
settings.general.windowPreviews.title=Show window previews on hover
settings.general.windowPreviews.helper=Show live window thumbnails above the Dock when hovering an already-open program. This is independent of the name tooltip.
settings.general.configBackup.title=Configuration & backup
settings.general.configBackup.helper=Export your configuration for migration to another PC. Before an import, Cedro automatically backs up the current config and restarts after a successful import.

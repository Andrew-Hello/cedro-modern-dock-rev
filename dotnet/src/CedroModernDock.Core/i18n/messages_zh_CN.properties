settings.iconsCustomization.size.helper=调整每个图标的视觉大小，同时保持 Dock 轮廓简洁。
settings.iconsCustomization.spacing.title=图标间距
settings.iconsCustomization.spacing.helper=控制 Dock 的紧凑或宽松程度，而不改变项目顺序。

settings.dockCustomization.transparency.title=Dock 透明度
settings.dockCustomization.transparency.helper=在桌面背景上平衡 Dock 的存在感与低调感。
settings.dockCustomization.rounding.title=边框圆角
settings.dockCustomization.rounding.helper=保持外观锐利现代，或在不偏离扁平风格的前提下柔化边角。
settings.dockCustomization.verticalPadding.title=Dock 上下内边距
settings.dockCustomization.verticalPadding.helper=调整图标上方和下方的留白。数值越小，Dock 条越窄。
settings.dockCustomization.background.title=Dock 背景颜色
settings.dockCustomization.background.helper=选择 Dock 图标下方的基础色调。


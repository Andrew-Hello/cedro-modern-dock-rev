settings.general.windowBehavior.title=窗口行为
settings.general.alwaysOnTop.title=总在最前
settings.general.alwaysOnTop.helper=让 Dock 始终显示在普通窗口上方；当前台程序或游戏进入真正全屏时会自动暂停置顶，退出全屏后自动恢复。
settings.general.edgeAutoHide.title=贴边自动隐藏
settings.general.edgeAutoHide.helper=静态定位时按所选边缘停靠；动态定位时，把 Dock 拖到任意已启用边缘附近松手即可吸附。收起后保留可见尾巴，鼠标划过或点击即可快速展开。
settings.general.edgeAutoHide.horizontal.title=水平边缘贴靠（上 / 下）
settings.general.edgeAutoHide.horizontal.helper=允许 Dock 吸附到屏幕顶部或底部并自动隐藏。底部会自动避开 Windows 任务栏。
settings.general.edgeAutoHide.vertical.title=垂直边缘贴靠（左 / 右）
settings.general.edgeAutoHide.vertical.helper=允许 Dock 吸附到屏幕左侧或右侧并自动隐藏，可与水平边缘贴靠独立开关。
settings.general.interaction.title=Dock 交互与提示
settings.general.runningIndicators.title=显示运行指示器
settings.general.runningIndicators.helper=程序运行时，在图标下方显示白色状态点。关闭后只隐藏白点，不影响运行程序识别。
settings.general.hoverMagnification.title=悬停时放大图标
settings.general.hoverMagnification.helper=鼠标指向图标时略微放大，作为视觉响应；关闭后图标保持原尺寸。
settings.general.hoverLabels.title=悬停时显示程序名称
settings.general.hoverLabels.helper=鼠标指向图标时显示名称标签；关闭后不再弹出程序名称提示。
settings.general.windowPreviews.title=悬停时显示窗口预览
settings.general.windowPreviews.helper=指向已经打开的程序时，在 Dock 上方显示实时窗口预览；可与名称标签独立开关。
settings.general.configBackup.title=配置与备份
settings.general.configBackup.helper=导出配置可用于迁移到其他电脑；导入前会自动备份当前配置，导入成功后 Cedro 会自动重启应用新设置。
settings.general.configBackup.openFolder=打开备份文件夹
